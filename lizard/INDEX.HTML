<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도마뱀 잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a pen-drawn browser window fills the screen; each tab is one toy web page; the lizard runs across the chrome between them */
:root{
  --ink:#1a1917;--paper:#ffffff;--orange:#ff6c2f;--muted:#6f6b64;--soft:#f5f4f1;
  --hatch:radial-gradient(circle,rgba(26,25,23,.6) 1px,transparent 1.3px) 0 0/5px 5px;
  --hatch-d:repeating-linear-gradient(-45deg,rgba(26,25,23,.4) 0 1px,transparent 1px 4px);
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}

/* ---- browser chrome ---- */
#browser{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.tabs{display:flex;align-items:flex-end;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;border-bottom:2px solid var(--ink);background:var(--hatch),var(--paper);flex-shrink:0;min-width:0}
.tab{position:relative;height:32px;display:flex;align-items:center;gap:7px;padding:0 12px;min-width:0;flex:0 1 190px;border:2px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0;background:var(--soft);margin:0 -1.5px -1.5px 0;font-size:13px;white-space:nowrap;color:var(--muted);cursor:pointer;overflow:hidden}
.tab.on{background:var(--paper);color:var(--ink);height:34px;z-index:2;font-weight:600}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--paper)}
.tab .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tab svg{width:15px;height:15px;flex-shrink:0}
.tab.new{animation:tabIn .35s ease-out}
@keyframes tabIn{from{flex-basis:0;padding:0;opacity:.2}}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plus{width:28px;height:28px;margin:0 0 3px 10px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);display:grid;place-items:center;flex-shrink:0;padding:0;cursor:pointer;transition:transform .12s}
.plus.press{transform:scale(.8);background:var(--orange)}
.plus svg{width:12px;height:12px}
.bar{height:48px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:2px solid var(--ink);flex-shrink:0;min-width:0}
.nav{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;border-radius:8px;cursor:pointer;padding:0;flex-shrink:0}
.nav:hover{background:var(--soft)}
.nav svg{width:18px;height:18px}
.addr{flex:1;min-width:0;height:32px;border:2px solid var(--ink);border-radius:4px;display:flex;align-items:center;gap:8px;padding:0 14px;font-family:var(--mono);font-size:13.5px;overflow:hidden;white-space:nowrap}
.addr svg{width:14px;height:14px;flex-shrink:0}
.addr .host{color:var(--muted)}
.caret{display:inline-block;width:1.5px;height:1.05em;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chip{font-family:var(--mono);font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:5px 10px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0;background:var(--paper)}
.chip.seen b{color:var(--orange);font-weight:500}
.chip.hintc.on{background:var(--orange);color:var(--ink)}
@media (max-width:560px){.nav.fw,.nav.rl,.chip.seen,#timer{display:none}.tab{flex-basis:150px}}

.view{position:relative;flex:1;min-height:0;overflow:hidden}
#page{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated;image-rendering:crisp-edges}
.pnote{position:absolute;right:18px;bottom:10px;font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:3px 8px;pointer-events:none}
.pnote:empty{display:none}
#hist{position:absolute;inset:0;background:var(--paper);overflow:auto;z-index:4;padding-inline:24px;padding-block:22px 40px}
#hist .hwrap{max-width:1040px;margin:0 auto;display:grid;gap:14px}
#hist .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0}
#hist h1{font-family:var(--display);font-size:clamp(28px,4.4vw,42px);margin:0;line-height:1.1}
#hist .hsum{margin:0;font-size:14.5px;color:var(--ink);display:flex;flex-wrap:wrap;gap:8px}
#hist .hsum span{border:2px solid var(--ink);padding:3px 10px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
#hist .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:6px}
.hcard{all:unset;cursor:pointer;display:grid;gap:8px;background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:10px;transition:transform .12s,box-shadow .12s;min-width:0}
.hcard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.hcard:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.hcard img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center 70%;image-rendering:pixelated;border:2px solid var(--ink);background:var(--paper)}
.hcard .hn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.hcard b{font-family:var(--display);font-size:18px}
.hcard .hs{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;border-top:2px dashed var(--ink);padding-top:6px}
.hcard.last{box-shadow:5px 5px 0 var(--orange)}
#hist .hfoot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:8px}
#hist .hnote{font-size:13px;color:var(--muted)}
#stickies{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#stickies div{position:absolute;left:0;top:0;font-family:var(--display);font-weight:700;font-size:14px;line-height:1.3;color:var(--ink);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;transform-origin:0 0}
#stickies div.edit::after{content:'|';animation:blink 1s steps(1) infinite}
#stickyIn{position:absolute;left:0;top:0;width:10px;height:10px;opacity:0;font-size:16px;border:0;padding:0;pointer-events:none}
#heads{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ph{position:absolute;left:0;right:0;top:0;padding:20px 24px 0;transition:transform .75s cubic-bezier(.7,0,.3,1)}
.ph .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.ph h1{font-family:var(--display);font-size:clamp(26px,4.2vw,40px);margin:0;line-height:1.1;text-wrap:balance}
.ph .d{margin:6px 0 0;max-width:54ch;font-size:14px;line-height:1.55;color:var(--muted);text-wrap:pretty}
#over{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;image-rendering:pixelated;image-rendering:crisp-edges}

.toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:9px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 40px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;text-wrap:balance;z-index:6}
.toast.on{opacity:1}

.modal{position:absolute;inset:0;background:rgba(255,255,255,.72);display:grid;place-items:center;padding:16px;z-index:8}
.card{background:var(--paper);border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);width:min(380px,100%);border-radius:6px;padding:22px 22px 18px}
.card .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.card h2{font-family:var(--display);font-size:30px;margin:4px 0 0;line-height:1.15}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:16px 0 18px;padding-top:14px;border-top:1.5px dashed var(--ink);font-size:13.5px}
.card dt{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.card dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.5}

/* ---- opening ---- */
#intro{position:absolute;inset:0;overflow:hidden;background:var(--paper);touch-action:none;cursor:pointer;z-index:7;will-change:transform}
#introCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#introPages .ib{position:absolute;left:0;right:0;top:22%;margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vw,46px);line-height:1.25;color:var(--ink);padding-inline:16px;text-wrap:balance;will-change:transform;visibility:hidden}
#introPages .ib.title{top:34%;font-size:clamp(56px,11.5vw,150px);line-height:1.05;letter-spacing:-.01em}
#introPrompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);font-family:var(--mono);font-size:13px;color:var(--paper);background:var(--ink);padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
#introSkip{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);cursor:pointer}
#app.enter #browser{animation:slideIn .8s cubic-bezier(.7,0,.3,1) both}
@keyframes slideIn{from{transform:translateX(100vw)}to{transform:none}}

.tab.gulp{animation:gulp .45s ease-out;transform-origin:50% 100%}
@keyframes gulp{30%{transform:translateY(-4px) scale(1.06,1.14)}65%{transform:translateY(1px) scale(.97,.94)}}
.tab.has-liz svg{color:var(--orange)}
@media (prefers-reduced-motion:reduce){.tab.gulp,.spin,.caret,#introPrompt{animation:none}}
</style>

<div id="app">
  <div id="browser">
    <div class="tabs" id="tabs">
      <button class="plus" id="plus" aria-label="새 탭"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></button>
    </div>
    <div class="bar">
      <button class="nav" id="back" aria-label="뒤로"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9H4M8.5 4.5 4 9l4.5 4.5"/></svg></button>
      <button class="nav fw" id="fwd" aria-label="앞으로"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h10M9.5 4.5 14 9l-4.5 4.5"/></svg></button>
      <button class="nav rl" id="reload" aria-label="새로고침"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 9.5A5.2 5.2 0 1 1 12.6 5"/><path d="M13.2 2.6v2.8h-2.8"/></svg></button>
      <div class="addr" id="addr"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5c1.5-.3 2.6-1.2 3.6-2.4 1-1.3 2.2-2.4 4.2-2.6 1.2-.1 2.2.5 2.2 1.3 0 .7-.8 1-1.6.9M5 8.6 4 11M8 6.6 7.5 9.4"/></svg><span><span class="host">lizard.web/</span><span id="slug"></span><span class="caret" id="caret" hidden></span></span></div>
      <span class="chip" id="timer" aria-label="경과 시간">00:00</span>
      <span class="chip hintc" id="hintChip">힌트까지 0:07</span>
      <span class="chip seen" id="seen">발견 <b>0</b></span>
    </div>
    <div class="view" id="view">
      <canvas id="page" aria-label="웹페이지 화면"></canvas>
      <div id="heads"></div>
      <div class="pnote" id="pnote"></div>
      <div id="stickies"></div>
      <section id="hist" hidden aria-label="방문 기록">
        <div class="hwrap">
          <p class="k">lizard.web/history</p>
          <h1>방문 기록</h1>
          <p class="hsum" id="hSum"></p>
          <div class="hgrid" id="hGrid"></div>
          <div class="hfoot"><button class="btn" id="hAgain">처음부터 다시</button><span class="hnote">썸네일을 누르면 그 페이지를 다시 열어 볼 수 있어요. 도마뱀은 이제 없어요.</span></div>
        </div>
      </section>
      <input id="stickyIn" type="text" maxlength="40" autocomplete="off" aria-label="메모 내용">
    </div>
  </div>
  <canvas id="over" aria-hidden="true"></canvas>

  <div id="intro"><canvas id="introCanvas" aria-label="오프닝 화면"></canvas><div id="introPages"></div><div id="introPrompt">화면을 누르거나 아래로 스크롤하세요</div><button class="chip" id="introSkip">건너뛰기</button></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ORANGE='#ff6c2f',INK='#1a1917';
let W=0,H=0,S=1,DPR=1,VX=0,VY=0,VW=0,VH=0;
const pcv=$('#page'),pc=pcv.getContext('2d',{willReadFrequently:true}),ocv=$('#over'),oc=ocv.getContext('2d',{willReadFrequently:true});
/* dot look: every canvas is drawn at 1/PIX resolution, then each pixel becomes paper, ink or a Bayer dot; only the lizard keeps its orange */
let PIX=3;
(function(){const d=Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype,'lineWidth');if(!d||!d.set)return;
  Object.defineProperty(CanvasRenderingContext2D.prototype,'lineWidth',{configurable:true,get(){return d.get.call(this)},set(v){d.set.call(this,Math.max(v,PIX*.85))}})})();
const BAY=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]].map(r=>r.map(v=>(v+.5)/64));
const INK1=[26,25,23],PAP1=[255,255,255],OR1=[255,108,47];
function oneBit(c,cv,keepA){const w=cv.width,h=cv.height;if(!w||!h)return;let img;try{img=c.getImageData(0,0,w,h)}catch(e){return}const d=img.data,lo=110,hi=226,sp=hi-lo;
  for(let y=0;y<h;y++){const row=BAY[y&7];for(let x=0;x<w;x++){const i=(y*w+x)*4;if(d[i+3]<128){if(keepA){d[i+3]=0}else{d[i]=d[i+1]=d[i+2]=255;d[i+3]=255}continue}
    const r=d[i],g=d[i+1],b=d[i+2];let o;if((r>120&&r>g*1.55&&r>b*2.1)||(r>200&&r-b>90&&r-g>55))o=OR1;else{const L=r*.3+g*.59+b*.11;o=L<=lo?INK1:L>=hi?PAP1:((L-lo)/sp>row[x&7]?PAP1:INK1)}
    d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=255}}
  c.putImageData(img,0,0)}

/* ---------- pen helpers ---------- */
function hatchRect(c,x0,y0,x1,y1,gap,lw){c.save();c.fillStyle=c.strokeStyle;c.globalAlpha*=clamp(lw/gap*1.7,.16,.62);c.fillRect(x0,y0,x1-x0,y1-y0);c.restore()}

/* ---------- lizard (procedural spine + IK legs), drawn in pen ---------- */
class Lizard{
  constructor(x,y,a){
    this.sp=6*S;this.n=30;this.a=a;this.v=0;this.max=150*S;this.tx=x;this.ty=y;this.ph=0;this.tail=true;this.leg=12*S;
    this.segs=[];for(let i=0;i<this.n;i++)this.segs.push({x:x-Math.cos(a)*i*this.sp,y:y-Math.sin(a)*i*this.sp});
    this.legs=[{s:4,side:1,g:0},{s:4,side:-1,g:1},{s:11,side:1,g:1},{s:11,side:-1,g:0}];
    for(const L of this.legs){const p=this.ideal(L);L.fx=p.x;L.fy=p.y;L.st=0}
  }
  W(i){const p=[4.6,6.2,6.4,5.2,6.4,7.4,7.9,8.1,8.1,7.9,7.4,6.6,5.6,4.9];return(i<p.length?p[i]:Math.max(.7,4.9*(1-(i-13)/17)))*S}
  frame(i){const s=this.segs,f=s[Math.max(0,i-1)],k=s[Math.min(s.length-1,i+1)];const a=i===0?this.a:Math.atan2(f.y-k.y,f.x-k.x);return{a,cx:Math.cos(a),cy:Math.sin(a)}}
  ideal(L){const b=this.segs[L.s],{a,cx,cy}=this.frame(L.s);const nx=-cy*L.side,ny=cx*L.side,r=this.leg*1.4;const fw=L.s<8?r*.4:-r*.05;return{x:b.x+nx*r+cx*fw,y:b.y+ny*r+cy*fw,a,cx,cy}}
  eyes(){const h=this.segs[0],f=this.frame(0);const ox=-f.cy*3.4*S,oy=f.cx*3.4*S,fx=f.cx*2.4*S,fy=f.cy*2.4*S;return[[h.x+fx+ox,h.y+fy+oy],[h.x+fx-ox,h.y+fy-oy]]}
  hit(x,y){let b=1e9;const s=this.segs;for(let i=0;i<Math.min(s.length,16);i++)b=Math.min(b,Math.hypot(s[i].x-x,s[i].y-y));return b}
  place(x,y,a){this.a=a;for(let i=0;i<this.segs.length;i++){this.segs[i].x=x-Math.cos(a)*i*this.sp;this.segs[i].y=y-Math.sin(a)*i*this.sp}for(const L of this.legs){const p=this.ideal(L);L.fx=p.x;L.fy=p.y;L.st=0}this.tx=x;this.ty=y;this.v=0}
  update(dt,onStep){
    const s=this.segs,h=s[0];
    const dx=this.tx-h.x,dy=this.ty-h.y,d=Math.hypot(dx,dy);
    const want=d>4*S?Math.min(this.max,30*S+d*2.4):0;
    this.v+=(want-this.v)*Math.min(1,dt*(want>this.v?5:9));
    if(d>3*S){const da=wrap(Math.atan2(dy,dx)-this.a);const tr=(4.5+this.v/(40*S))*dt;this.a+=clamp(da,-tr,tr)}
    this.ph+=dt*this.v/(9*S);
    const sway=Math.sin(this.ph)*.38*Math.min(1,this.v/(60*S)),ang=this.a+sway;
    h.x+=Math.cos(ang)*this.v*dt;h.y+=Math.sin(ang)*this.v*dt;
    let prev=this.a+Math.PI;
    for(let i=1;i<s.length;i++){const p=s[i-1],q=s[i];let dir=Math.atan2(q.y-p.y,q.x-p.x);const dd=wrap(dir-prev),mb=i<5?.55:.36;if(dd>mb)dir=prev+mb;else if(dd<-mb)dir=prev-mb;q.x=p.x+Math.cos(dir)*this.sp;q.y=p.y+Math.sin(dir)*this.sp;prev=dir}
    for(const L of this.legs){const I=this.ideal(L);
      if(L.st>0){L.st+=dt*(5+this.v/(22*S));const t=Math.min(1,L.st),e=t*t*(3-2*t);L.fx=lerp(L.ox,L.nx,e);L.fy=lerp(L.oy,L.ny,e);if(t>=1){L.st=0;onStep&&onStep(L.fx,L.fy,I.a)}}
      else{const dd=Math.hypot(L.fx-I.x,L.fy-I.y);const busy=this.legs.some(o=>o.g!==L.g&&o.st>0);if(dd>this.leg*1.05&&!busy){L.st=1e-4;L.ox=L.fx;L.oy=L.fy;L.nx=I.x+I.cx*this.leg*.7;L.ny=I.y+I.cy*this.leg*.7}}}
  }

      for(const sk of st.streaks)sk.y-=sk.v*dt;st.streaks=st.streaks.filter(sk=>sk.y+sk.l>-20);pose(L,IN.cx+Math.sin(k*Math.PI)*24*S,f.y,lerp(f.rot0,-.2,eo),t,3.5*S);

    else{if(st.settle>0){st.settle-=dt;pose(L,IN.cx,IN.cy,Math.atan2(L.segs[0].y-L.segs[10].y,L.segs[0].x-L.segs[10].x),t,3.5*S*Math.max(0,st.settle/.45));L.tx=L.segs[0].x;L.ty=L.segs[0].y;L.v=0;if(st.settle<=0){IN.lock=false;introPrompt()}}
      else L.update(dt)}}
  if(i===2&&L)lookAround(st,L,dt,t);
  if(i===3&&L){
    if(st.started){const el=now-st.startAt;if(el>.35&&!st.bang)st.bang=.001;if(el>1.35&&!st.runSet){st.runSet=true;L.tx=W+380*S;L.ty=L.segs[0].y-10*S;L.max=520*S}}
    L.update(dt,(x,y,a)=>{if(st.runSet){st.prints.push({x,y,a,t:performance.now()/1000});if(st.prints.length>90)st.prints.shift()}});
    if(st.runSet&&IN.lock&&L.segs[0].x>W*.95){IN.lock=false;introPrompt()}}
  st.prints=st.prints.filter(p=>now-p.t<1.1);
  if(st.bang>0)st.bang=Math.min(1,st.bang+dt*3.5);
  if(st.thud>0)st.thud=Math.max(0,st.thud-dt*1.25);
  for(const d of st.dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.92;d.vy*=.92;d.r+=12*S*dt;d.life-=dt*1.4}st.dust=st.dust.filter(d=>d.life>0)}
function lookAround(st,L,dt,t){
  if(!st.rest){st.rest={segs:L.segs.map(p=>({x:p.x,y:p.y})),feet:L.legs.map(l=>({x:l.fx,y:l.fy}))};
    Object.assign(st,{look:0,lookT:0,lookAt:t+.4,rot:0,rotT:0,mode:'look',modeEnd:t+1.3,ph:0,amp:0,step:-1,stepT:0,stepAt:t+.9,last:''})}
  const R=st.rest,n=L.segs.length,c=R.segs[10];
  if(t>st.modeEnd){
    if(st.mode!=='look'){st.mode='look';st.modeEnd=t+rand(1.1,1.8)}
    else{const m=st.last==='march'?'turn':st.last==='turn'?'march':(Math.random()<.5?'march':'turn');st.mode=st.last=m;
      if(m==='march')st.modeEnd=t+rand(1.6,2.3);
      else{st.modeEnd=t+rand(1.1,1.5);const d=Math.abs(st.rotT)>.7?-Math.sign(st.rotT):(Math.random()<.5?-1:1);st.rotT=clamp(st.rotT+d*rand(.55,.95),-1.2,1.2)}}}
  const moving=st.mode!=='look';
  st.amp+=((moving?1:0)-st.amp)*Math.min(1,dt*6);
  st.ph+=dt*10*(.25+.75*st.amp);
  st.rot+=(st.rotT-st.rot)*Math.min(1,dt*2.4);
  if(!moving&&t>st.lookAt){st.lookAt=t+rand(.55,1.3);const o=[0,.6,-.6,.38,-.38,.15];let v;do{v=o[Math.random()*o.length|0]}while(v===st.lookT);st.lookT=v}
  if(moving)st.lookT=0;
  st.look+=(st.lookT-st.look)*Math.min(1,dt*10);
  const cr=Math.cos(st.rot),sr=Math.sin(st.rot),rp=p=>{const dx=p.x-c.x,dy=p.y-c.y;return{x:c.x+dx*cr-dy*sr,y:c.y+dx*sr+dy*cr}};
  const B=R.segs.map(rp),pv=B[8];
  for(let i=0;i<n;i++){let x=B[i].x,y=B[i].y;
    const j0=Math.max(0,i-1),j1=Math.min(n-1,i+1),dx=B[j0].x-B[j1].x,dy=B[j0].y-B[j1].y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl;
    let lat=Math.sin(st.ph-i*.26)*5.5*S*st.amp*(.35+i/28);
    if(i>=15){const f=(i-15)/(n-15);lat+=Math.sin(t*2.4-i*.32)*9*S*f*f*(1-st.amp*.5)}
    x+=nx*lat;y+=ny*lat;
    if(i<8){const w=Math.pow((8-i)/8,1.3),a=st.look*w,ex=x-pv.x,ey=y-pv.y,ca=Math.cos(a),sa=Math.sin(a);x=pv.x+ex*ca-ey*sa;y=pv.y+ex*sa+ey*ca}
    L.segs[i].x=x;L.segs[i].y=y}
  L.a=Math.atan2(L.segs[0].y-L.segs[1].y,L.segs[0].x-L.segs[1].x);
  if(!moving&&t>st.stepAt&&st.step<0){st.step=Math.random()*4|0;st.stepT=0;st.stepAt=t+rand(1,2)}
  for(let k=0;k<L.legs.length;k++){const lg=L.legs[k],f=rp(R.feet[k]),s=lg.s,a0=B[Math.max(0,s-1)],a1=B[Math.min(n-1,s+1)],dl=Math.hypot(a0.x-a1.x,a0.y-a1.y)||1,fx=(a0.x-a1.x)/dl,fy=(a0.y-a1.y)/dl;
    if(st.amp>.02){const ph=st.ph+lg.g*Math.PI,sw=Math.cos(ph)*6*S*st.amp,up=Math.max(0,Math.sin(ph))*3*S*st.amp;f.x+=fx*sw-fy*up*lg.side;f.y+=fy*sw+fx*up*lg.side}
    if(k===st.step){st.stepT=Math.min(1,st.stepT+dt/.32);const up=Math.sin(st.stepT*Math.PI)*5*S;f.x+=fx*up*.6;f.y+=fy*up*.6-up*.4;if(st.stepT>=1)st.step=-1}
    lg.fx=f.x;lg.fy=f.y;lg.st=0}}
function drawIntro(i){const c=ictx,st=IN.st[i];if(!st)return;const now=performance.now()/1000;
  drawPrints(c,st.prints,now);
  const L=st.L;c.strokeStyle=INK;c.lineCap='round';
  if(st.streaks&&st.streaks.length){c.lineWidth=1.5*S;c.beginPath();for(const sk of st.streaks){c.moveTo(sk.x,sk.y);c.lineTo(sk.x,sk.y+sk.l)}c.stroke()}
  if(L){if(i===1&&st.fall){if(st.started){const k=Math.min(1,st.fall.t/st.fall.dur),e=k<.72?k*.22:.16+Math.pow((k-.72)/.28,2)*.84;
      const rx=(30+50*e)*S,ry=(10+16*e)*S;c.save();c.beginPath();c.ellipse(IN.cx,IN.cy+6*S,rx,ry,0,0,7);c.clip();c.globalAlpha=.35+.65*e;hatchRect(c,IN.cx-rx,IN.cy+6*S-ry,IN.cx+rx,IN.cy+6*S+ry,(5.5-2.4*e)*S,.9*S);c.restore();
      const sc=1.25-.25*e,py=st.fall.y;c.save();c.translate(IN.cx,py);c.scale(sc,sc);c.translate(-IN.cx,-py);L.draw(c,{noShadow:true});c.restore()}}
    else L.draw(c);
    if(st.bang>0)drawBang(c,L.segs[0],st.bang)}
  c.strokeStyle=INK;for(const d of st.dust){c.globalAlpha=Math.max(0,d.life);c.lineWidth=1*S;c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.stroke()}c.globalAlpha=1;
  if(st.thud>0){const a=1-st.thud,sc=(a<.14?a/.14*1.25:a<.3?1.25-(a-.14)/.16*.25:1)*(a>.65?1-(a-.65)/.35:1);if(sc>.05){c.save();c.translate(IN.cx+58*S,IN.cy-30*S-a*42*S);c.rotate(-.12);c.scale(sc,sc);c.font=`700 ${Math.round(26*S+8)}px "Gowun Batang", serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=INK;c.fillText('툭!',0,0);c.restore()}}}
function introRender(){ictx.setTransform(DPR,0,0,DPR,0,0);ictx.fillStyle='#fff';ictx.fillRect(0,0,W,H);
  const e=easeIO(IN.p);drawIntro(IN.page);oneBit(ictx,icv,false);
  IN.els.forEach((el,i)=>{let y=null;if(IN.anim){if(i===IN.from)y=-e*H;else if(i===IN.page)y=(1-e)*H}else if(i===IN.page)y=0;
    el.style.visibility=y===null?'hidden':'visible';el.style.transform=`translateY(${y===null?H:y.toFixed(1)}px)`})}
function introEnd(){if(!IN.on||IN.ending)return;IN.ending=true;$('#introPrompt').hidden=true;
  const app=$('#app');app.classList.add('enter');
  const box=$('#intro');box.style.transition=reduce?'none':'transform .8s cubic-bezier(.7,0,.3,1)';box.style.transform='translateX(-100%)';
  measure();G.start();
  setTimeout(()=>{IN.on=false;box.hidden=true;app.classList.remove('enter');measure()},reduce?0:820)}
(function(){const box=$('#intro'),skip=$('#introSkip');
  for(const ev of['pointerdown','pointerup'])skip.addEventListener(ev,e=>e.stopPropagation());
  skip.addEventListener('click',e=>{e.stopPropagation();introEnd()});

  box.addEventListener('pointerup',e=>{if(IN.downY===null)return;const dy=e.clientY-IN.downY;IN.downY=null;if(dy<-40||Math.abs(dy)<14)introNext()});
  box.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(e.deltaY>12&&n-IN.lastWheel>850){IN.lastWheel=n;introNext()}},{passive:false});
  addEventListener('keydown',e=>{if(IN.on&&!IN.ending&&(e.key===' '||e.key==='Enter'||e.key==='ArrowDown')){e.preventDefault();introNext()}});
  introPrompt()})();

/* ---------- loop + sizing ---------- */
let errShown=false;function showErr(e){if(errShown)return;errShown=true;const m=document.createElement('div');m.style.cssText='position:absolute;left:16px;right:16px;top:64px;background:#1a1917;color:#ffb48f;font:12px/1.5 ui-monospace,Menlo,monospace;padding:10px 12px;border-radius:8px;z-index:9;white-space:pre-wrap';m.textContent='화면을 그리다 오류가 났어요. 이 내용을 알려주세요:\n'+(e&&e.stack||e);$('#app').appendChild(m)}
addEventListener('error',e=>showErr(e.error||e.message));
let ready=false,last=performance.now(),lastSec=-1;
function loop(ms){const dt=Math.min(.033,Math.max(0,(ms-last)/1000));last=ms;const t=ms/1000;
  try{if(ready){
    if(IN.on&&!IN.ending){introUpdate(dt,t);introRender()}
    if(G.mode!=='off'){gameUpdate(dt,t);gameRender(t);if(G.mode!=='caught'&&G.mode!=='ended'){const sec=Math.floor((performance.now()-G.t0)/1000);if(sec!==lastSec){lastSec=sec;$('#timer').textContent=fmt(performance.now()-G.t0);const hc=$('#hintChip'),left=Math.ceil(HARD-(performance.now()/1000-G.pageT0));if(G.mode==='play'&&left>0){hc.textContent=`힌트까지 0:${String(left).padStart(2,'0')}`;hc.classList.remove('on')}else if(G.mode==='play'){hc.textContent='힌트 켜짐';hc.classList.add('on')}}}}
    else if(IN.ending){gameRender(t)}}}catch(e){showErr(e)}
  requestAnimationFrame(loop)}
function measure(){const r=$('#view').getBoundingClientRect(),br=$('#browser').getBoundingClientRect();VX=r.left-br.left;VY=r.top-br.top;VW=r.width;VH=r.height;
  pcv.width=Math.ceil(VW*DPR);pcv.height=Math.ceil(VH*DPR)}
function resize(){const w=innerWidth,h=innerHeight;if(w<60||h<60)return;const first=!ready;W=w;H=h;PIX=w<600?2.5:3;DPR=1/PIX;S=clamp(Math.min(W,H)/760,.62,1.05);
  ocv.width=Math.ceil(W*DPR);ocv.height=Math.ceil(H*DPR);measure();introLayout();
  if(G.mode!=='off'){const pg=VIEW();pg.layout();if(G.mode==='play'&&G.view===G.pi){const sp=pg.spot();const r=pg.rect();const hd=G.liz.segs[0];if(hd.x<r.x0-40||hd.x>r.x1+40||hd.y<r.y0-40||hd.y>r.y1+40){G.liz.place(sp.x,sp.y,0)}}}
  if(first)ready=true}
let rt=0;const onRs=()=>{clearTimeout(rt);rt=setTimeout(()=>{try{resize()}catch(e){showErr(e)}},ready?150:0)};addEventListener('resize',onRs);

})();
